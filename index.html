<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Global Web Chat</title>
  <style>
    :root {
      --bg-primary: #313338;
      --bg-secondary: #2b2d31;
      --bg-tertiary: #1e1f22;
      --bg-accent: #404249;
      --text-normal: #dbdee1;
      --text-muted: #949ba4;
      --brand: #5865f2;
      --brand-hover: #4752c4;
      --green: #23a55a;
      --danger: #da373c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-tertiary);
      color: var(--text-normal);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* --- LOGIN & AUTH OVERLAY --- */
    #auth-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-tertiary);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .auth-card {
      background-color: var(--bg-secondary);
      padding: 32px;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      text-align: center;
    }

    .auth-card h2 {
      color: #fff;
      margin-bottom: 8px;
    }

    .auth-card p {
      color: var(--text-muted);
      margin-bottom: 20px;
      font-size: 14px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-tertiary);
      border: 1px solid rgba(0,0,0,0.3);
      border-radius: 4px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--brand);
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--brand);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .auth-btn:hover {
      background-color: var(--brand-hover);
    }

    .auth-toggle {
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .auth-toggle span {
      color: #00a8fc;
      cursor: pointer;
      text-decoration: underline;
    }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    /* --- DISCORD APP MAIN LAYOUT --- */
    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .server-sidebar {
      width: 72px;
      background-color: var(--bg-tertiary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 12px;
    }

    .server-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background-color: var(--brand);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-weight: bold;
      font-size: 18px;
    }

    .channels-sidebar {
      width: 240px;
      background-color: var(--bg-secondary);
      display: flex;
      flex-direction: column;
    }

    .server-header {
      height: 48px;
      border-bottom: 1px solid rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: bold;
      color: #fff;
    }

    .channel-list {
      padding: 8px;
      flex-grow: 1;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 4px;
      background-color: var(--bg-accent);
      color: #fff;
      font-weight: 500;
    }

    .user-panel {
      height: 56px;
      background-color: #232428;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      flex-shrink: 0;
    }

    .user-info {
      flex-grow: 1;
      overflow: hidden;
    }

    .user-name {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .logout-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .logout-btn:hover {
      background-color: var(--danger);
      color: #fff;
    }

    /* Main Chat Area */
    .chat-area {
      flex-grow: 1;
      background-color: var(--bg-primary);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      height: 48px;
      border-bottom: 1px solid rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: bold;
      color: #fff;
      gap: 6px;
    }

    .chat-messages {
      flex-grow: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 14px;
    }

    .message-content {
      display: flex;
      flex-direction: column;
    }

    .message-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .author {
      color: #fff;
      font-weight: 600;
      font-size: 14px;
    }

    .timestamp {
      color: var(--text-muted);
      font-size: 11px;
    }

    .text {
      color: var(--text-normal);
      font-size: 14px;
      margin-top: 4px;
      line-height: 1.4;
      word-break: break-word;
    }

    .chat-input-wrapper {
      padding: 0 16px 20px 16px;
    }

    .chat-input-container {
      background-color: #383a40;
      border-radius: 8px;
      padding: 0 16px;
    }

    .chat-input-container input {
      width: 100%;
      height: 44px;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
    }
  </style>

  <!-- Firebase Real-time Engine (CDNs) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- LOGIN / REGISTER OVERLAY -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2 id="auth-title">Welcome Back!</h2>
      <p id="auth-subtitle">Log in with your account credentials</p>
      <div id="error-box" class="error-msg"></div>

      <form id="auth-form">
        <div class="input-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="off" placeholder="Enter username..." />
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="off" placeholder="Enter password..." />
        </div>

        <button type="submit" id="submit-btn" class="auth-btn">Log In</button>
      </form>

      <div class="auth-toggle">
        <span id="toggle-auth-mode">Need an account? Register</span>
      </div>
    </div>
  </div>

  <!-- MAIN CHAT APPLICATION -->
  <div id="app-container">
    
    <div class="server-sidebar">
      <div class="server-icon">D</div>
    </div>

    <div class="channels-sidebar">
      <div class="server-header">
        <span>Global Server</span>
      </div>
      <div class="channel-list">
        <div class="channel-item">
          <span>#</span> global-chat
        </div>
      </div>
      <div class="user-panel">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
          <div class="user-name" id="display-user-name">Guest</div>
        </div>
        <button class="logout-btn" id="logout-btn">Logout</button>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <span>#</span> global-chat
      </div>

      <div class="chat-messages" id="message-container"></div>

      <div class="chat-input-wrapper">
        <div class="chat-input-container">
          <input type="text" id="chat-input" placeholder="Message #global-chat..." autocomplete="off" />
        </div>
      </div>
    </div>

  </div>

  <script>
    // --- 1. FIREBASE REAL-TIME DATABASE SETUP ---
    // Uses a public demo Firebase endpoint to sync across devices worldwide instantly.
    const firebaseConfig = {
      databaseURL: "https://discord-clone-global-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messagesRef = db.ref("global_messages");

    // --- 2. STATE MANAGEMENT ---
    let currentUser = null;
    let isRegisterMode = false;

    // DOM Elements
    const authScreen = document.getElementById('auth-screen');
    const authForm = document.getElementById('auth-form');
    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const toggleAuthMode = document.getElementById('toggle-auth-mode');
    const errorBox = document.getElementById('error-box');

    const displayUserName = document.getElementById('display-user-name');
    const userAvatar = document.getElementById('user-avatar');
    const logoutBtn = document.getElementById('logout-btn');

    const messageContainer = document.getElementById('message-container');
    const chatInput = document.getElementById('chat-input');

    // Load registered accounts from localStorage
    function getStoredAccounts() {
      return JSON.parse(localStorage.getItem('app_accounts') || '{}');
    }

    function saveAccount(user, pass) {
      const accounts = getStoredAccounts();
      accounts[user.toLowerCase()] = { username: user, password: pass };
      localStorage.setItem('app_accounts', JSON.stringify(accounts));
    }

    // Toggle between Login and Register
    toggleAuthMode.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      errorBox.style.display = 'none';
      if (isRegisterMode) {
        authTitle.textContent = "Create an Account";
        authSubtitle.textContent = "Register with a username and password";
        submitBtn.textContent = "Register";
        toggleAuthMode.textContent = "Already have an account? Log In";
      } else {
        authTitle.textContent = "Welcome Back!";
        authSubtitle.textContent = "Log in with your account credentials";
        submitBtn.textContent = "Log In";
        toggleAuthMode.textContent = "Need an account? Register";
      }
    });

    // Handle Form Auth
    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const userVal = usernameInput.value.trim();
      const passVal = passwordInput.value.trim();
      const accounts = getStoredAccounts();
      const key = userVal.toLowerCase();

      errorBox.style.display = 'none';

      if (isRegisterMode) {
        if (accounts[key]) {
          showError("Username is already taken!");
          return;
        }
        saveAccount(userVal, passVal);
        loginUser(userVal);
      } else {
        if (!accounts[key] || accounts[key].password !== passVal) {
          showError("Invalid username or password.");
          return;
        }
        loginUser(accounts[key].username);
      }
    });

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function loginUser(name) {
      currentUser = name;
      displayUserName.textContent = currentUser;
      userAvatar.textContent = currentUser.charAt(0).toUpperCase();
      authScreen.style.display = 'none';
      usernameInput.value = '';
      passwordInput.value = '';
      chatInput.focus();
    }

    // Logout
    logoutBtn.addEventListener('click', () => {
      currentUser = null;
      authScreen.style.display = 'flex';
    });

    // --- 3. MESSAGING LOGIC ---
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function renderMessage(data) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      const initial = data.author ? data.author.charAt(0).toUpperCase() : '?';

      msgDiv.innerHTML = `
        <div class="avatar">${initial}</div>
        <div class="message-content">
          <div class="message-header">
            <span class="author">${escapeHtml(data.author || 'Anonymous')}</span>
            <span class="timestamp">${data.timestamp || ''}</span>
          </div>
          <div class="text">${escapeHtml(data.text || '')}</div>
        </div>
      `;

      messageContainer.appendChild(msgDiv);
      messageContainer.scrollTop = messageContainer.scrollHeight;
    }

    // Send Message
    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || !currentUser) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      messagesRef.push({
        author: currentUser,
        text: text,
        timestamp: time
      });

      chatInput.value = '';
    }

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Listen to Firebase incoming real-time messages worldwide
    messagesRef.limitToLast(50).on('child_added', (snapshot) => {
      const data = snapshot.val();
      renderMessage(data);
    });
  </script>
</body>
</html>
