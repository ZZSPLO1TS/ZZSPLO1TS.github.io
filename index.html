<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* App Layout */
        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            background-color: #a3a3a3;
        }

        /* Auth Overlay */
        #auth-overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .auth-box {
            background: #5c5c5c;
            padding: 30px;
            border-radius: 8px;
            color: white;
            text-align: center;
            width: 300px;
        }
        .auth-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 4px;
            outline: none;
        }
        .auth-box button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 180px;
            background-color: #5c5c5c;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            position: relative;
            border-right: 4px solid #000000;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            background-color: #000000;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        .profile-username {
            color: #000000;
            font-size: 20px;
            font-weight: 500;
            text-align: center;
            word-break: break-all;
        }
        .logout-btn {
            position: absolute;
            bottom: 40px;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            font-weight: normal;
        }
        .logout-btn:hover {
            text-decoration: underline;
        }

        /* Chat Section Styling */
        #chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #a3a3a3;
        }
        #messages-list {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message-item {
            font-size: 24px;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .message-item img {
            max-width: 300px;
            max-height: 200px;
            border-radius: 6px;
            margin-top: 8px;
        }

        /* Bottom Controls Area */
        #input-area {
            display: flex;
            padding: 15px;
            background-color: #8c8c8c;
            gap: 10px;
            align-items: center;
        }
        #message-input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            outline: none;
        }
        .file-label {
            background-color: #5c5c5c;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        #image-input {
            display: none;
        }
        #send-btn {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script>
        function checkHash() {
            const root = document.getElementById("root");
            
            // Checks if there is any hash present (e.g., #chat, #app, #1)
            if (window.location.hash.length > 0) {
                renderApp(root);
            } else {
                root.innerHTML = ""; // Stays completely blank on plain URL
            }
        }

        window.addEventListener("hashchange", checkHash);
        window.addEventListener("DOMContentLoaded", checkHash);

        function renderApp(container) {
            // Prevent re-rendering if already built
            if (document.getElementById("app-container")) return;

            container.innerHTML = `
                <div id="auth-overlay" style="display: none;">
                    <div class="auth-box">
                        <h2>Login / Register</h2>
                        <input type="text" id="username-input" placeholder="Enter Username..." />
                        <button id="login-btn">Start Chatting</button>
                    </div>
                </div>

                <div id="app-container">
                    <div id="sidebar">
                        <div class="profile-avatar"></div>
                        <div class="profile-username" id="display-username">@account</div>
                        <button class="logout-btn" id="logout-btn">logout</button>
                    </div>
                    <div id="chat-section">
                        <div id="messages-list"></div>
                        <div id="input-area">
                            <input type="text" id="message-input" placeholder="Type a message..." />
                            <label for="image-input" class="file-label">📷 Image</label>
                            <input type="file" id="image-input" accept="image/*" />
                            <button id="send-btn">Send</button>
                        </div>
                    </div>
                </div>
            `;

            let currentUser = localStorage.getItem("chat_user") || "";
            const authOverlay = document.getElementById("auth-overlay");
            const displayUsername = document.getElementById("display-username");
            const messagesList = document.getElementById("messages-list");

            function updateAuthView() {
                if (!currentUser) {
                    authOverlay.style.display = "flex";
                } else {
                    authOverlay.style.display = "none";
                    displayUsername.textContent = "@" + currentUser;
                }
            }

            document.getElementById("login-btn").addEventListener("click", () => {
                const val = document.getElementById("username-input").value.trim();
                if (val) {
                    currentUser = val;
                    localStorage.setItem("chat_user", currentUser);
                    updateAuthView();
                }
            });

            document.getElementById("logout-btn").addEventListener("click", () => {
                localStorage.removeItem("chat_user");
                currentUser = "";
                updateAuthView();
            });

            const defaultMessages = [
                { user: "account", text: "yo" },
                { user: "account123", text: "sup bro" }
            ];

            function renderMessages() {
                const savedMsgs = JSON.parse(localStorage.getItem("chat_messages")) || defaultMessages;
                messagesList.innerHTML = "";
                savedMsgs.forEach(msg => {
                    const item = document.createElement("div");
                    item.className = "message-item";
                    
                    let content = `<span>@${msg.user} : ${msg.text || ''}</span>`;
                    if (msg.image) {
                        content += `<img src="${msg.image}" alt="Sent attachment" />`;
                    }
                    
                    item.innerHTML = content;
                    messagesList.appendChild(item);
                });
                messagesList.scrollTop = messagesList.scrollHeight;
            }

            function sendMessage() {
                if (!currentUser) {
                    alert("Please log in first!");
                    return;
                }

                const textInput = document.getElementById("message-input");
                const fileInput = document.getElementById("image-input");
                const text = textInput.value.trim();
                const file = fileInput.files[0];

                if (!text && !file) return;

                const savedMsgs = JSON.parse(localStorage.getItem("chat_messages")) || defaultMessages;

                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        savedMsgs.push({
                            user: currentUser,
                            text: text,
                            image: e.target.result
                        });
                        localStorage.setItem("chat_messages", JSON.stringify(savedMsgs));
                        textInput.value = "";
                        fileInput.value = "";
                        renderMessages();
                    };
                    reader.readAsDataURL(file);
                } else {
                    savedMsgs.push({
                        user: currentUser,
                        text: text
                    });
                    localStorage.setItem("chat_messages", JSON.stringify(savedMsgs));
                    textInput.value = "";
                    renderMessages();
                }
            }

            document.getElementById("send-btn").addEventListener("click", sendMessage);
            document.getElementById("message-input").addEventListener("keypress", (e) => {
                if (e.key === "Enter") sendMessage();
            });

            updateAuthView();
            renderMessages();
        }
    </script>
</body>
</html>
